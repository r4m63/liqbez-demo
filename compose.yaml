services:
  eureka-service:
    build:
      context: .
      args:
        SERVICE: eureka-service
    ports:
      - "8761:8761"

  # consul:
  #   image: hashicorp/consul:1.21.3
  #   command: agent -dev -ui -client=0.0.0.0
  #   ports:
  #     - "8500:8500"
  #   healthcheck:
  #     test: ["CMD", "consul", "members"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

  patient-service:
    build:
      context: .
      args:
        SERVICE: patient-service
    environment:
      EUREKA_URL: http://eureka-service:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # CONSUL_HOST: consul
      # SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS: "true"
    depends_on:
      - eureka-service

  appointment-service:
    build:
      context: .
      args:
        SERVICE: appointment-service
    environment:
      EUREKA_URL: http://eureka-service:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      DEMO_DATA_DIR: /data
      XA_PATIENT_URL: jdbc:postgresql://xa-patient-db:5432/patientdb
      XA_BILLING_URL: jdbc:postgresql://xa-billing-db:5432/billingdb
      IMPORT_STORAGE: ${IMPORT_STORAGE:-local}
      MINIO_URL: ${MINIO_URL:-http://host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-liqbez-demo}
      # CONSUL_HOST: consul
      # SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS: "true"
    depends_on:
      - eureka-service
      - patient-service
      - payment-service
      - xa-patient-db
      - xa-billing-db
    volumes:
      - appointment-data:/data

  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    environment:
      EUREKA_URL: http://eureka-service:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      DEMO_DATA_DIR: /data
    depends_on:
      - eureka-service
    volumes:
      - payment-data:/data

  xa-patient-db:
    image: postgres:17
    command: ["postgres", "-c", "max_prepared_transactions=20"]
    environment:
      POSTGRES_DB: patientdb
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - xa-patient-data:/var/lib/postgresql/data
      - ./postgres/patient.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d patientdb"]
      interval: 5s
      retries: 10

  xa-billing-db:
    image: postgres:17
    command: ["postgres", "-c", "max_prepared_transactions=20"]
    environment:
      POSTGRES_DB: billingdb
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - xa-billing-data:/var/lib/postgresql/data
      - ./postgres/billing.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d billingdb"]
      interval: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    environment:
      EUREKA_URL: http://eureka-service:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # CONSUL_HOST: consul
      # SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS: "true"
    ports:
      - "18080:8080"
    depends_on:
      - eureka-service
      - patient-service
      - appointment-service

volumes:
  appointment-data:
  payment-data:
  xa-patient-data:
  xa-billing-data:
