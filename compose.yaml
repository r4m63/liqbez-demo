services:
  consul:
    image: hashicorp/consul:1.21.3
    command: agent -dev -ui -client=0.0.0.0
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 10

  patient-service:
    build:
      context: .
      args:
        SERVICE: patient-service
    environment:
      CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS: "true"
    depends_on:
      consul:
        condition: service_healthy

  appointment-service:
    build:
      context: .
      args:
        SERVICE: appointment-service
    environment:
      CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS: "true"
    depends_on:
      consul:
        condition: service_healthy
      patient-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    environment:
      CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS: "true"
    ports:
      - "18080:8080"
    depends_on:
      consul:
        condition: service_healthy
      patient-service:
        condition: service_started
      appointment-service:
        condition: service_started
