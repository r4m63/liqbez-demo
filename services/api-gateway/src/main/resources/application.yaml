server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patients
              uri: lb://patient-service
              predicates:
                - Path=/patients/**
            - id: appointments
              uri: lb://appointment-service
              predicates:
                - Path=/appointments/**
eureka:
  client:
    registry-fetch-interval-seconds: 5
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
