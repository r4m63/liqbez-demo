server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patients
              uri: lb://patient-service
              predicates:
                - Path=/patients/**
            - id: appointments
              uri: lb://appointment-service
              predicates:
                - Path=/appointments/**
            - id: payments
              uri: lb://payment-service
              predicates:
                - Path=/payments/**
            - id: transactions
              uri: lb://appointment-service
              predicates:
                - Path=/transactions/**
#    consul:
#      host: ${CONSUL_HOST:localhost}
#      port: ${CONSUL_PORT:8500}
#      discovery:
#        instance-id: ${spring.application.name}:${HOSTNAME:${random.value}}
eureka:
  client:
    registry-fetch-interval-seconds: 5
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
