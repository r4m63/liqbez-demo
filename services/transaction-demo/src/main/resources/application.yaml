server:
  port: 8084
spring:
  application:
    name: transaction-demo
eureka:
  client:
    registry-fetch-interval-seconds: 5
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
demo:
  xa:
    patient-url: ${XA_PATIENT_URL:jdbc:postgresql://localhost:5433/patientdb}
    billing-url: ${XA_BILLING_URL:jdbc:postgresql://localhost:5434/billingdb}
    user: ${XA_DB_USER:demo}
    password: ${XA_DB_PASSWORD:demo}
